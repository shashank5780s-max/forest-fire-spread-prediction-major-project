services:
  - type: web
    name: firecast-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ALLOWED_ORIGINS
        value: "https://frontend-five-iota-g9h6y0e84w.vercel.app"
      - key: CORS_ALLOWED_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
